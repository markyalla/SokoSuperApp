services:
  postgres:
    image: postgis/postgis:15-3.4
    # Pulled from the .env file sitting next to this compose file (Compose
    # substitutes ${...} here automatically) — the same DB_USER/DB_PASSWORD
    # the api/worker containers use to connect, so there's only one place to
    # change credentials instead of keeping this file and .env in sync by hand.
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_MULTIPLE_DATABASES: sokoaccount,sokoshopper,sokodelivery,sokoloan,sokosusu,sokobank,sokoindex
    # Bound to loopback only: reachable from this host (incl. desktop Docker
    # Desktop -> localhost:5432) but never from the public internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./internal/utils/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    # Loopback-only, same reasoning as postgres above.
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: minio/minio
    # Loopback-only — nothing in the app returns a direct MinIO URL to
    # clients, so the API's internal port (8082) is the only one that
    # needs to stay public.
    ports:
      - "127.0.0.1:9000:9000" # MinIO API port
      - "127.0.0.1:9001:9001" # MinIO Console port
    # Same idea as postgres above — pulled from .env so STORAGE_ACCESS_KEY/
    # STORAGE_SECRET_KEY only ever need to be set in one place.
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - minio_data:/data # Persistent storage for MinIO data

  api:
    build: .
    env_file: .env
    # .env has DB_HOST/REDIS_HOST/STORAGE_ENDPOINT set to localhost for
    # running api/worker directly on the host during development — inside
    # this container "localhost" means the container itself, so the actual
    # other services must be reached by their compose service name instead.
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      STORAGE_ENDPOINT: minio:9000
    ports:
      - "8082:8082"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy

  worker:
    build: .
    env_file: .env
    command: ["./worker"]
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      STORAGE_ENDPOINT: minio:9000
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy

volumes:
  minio_data:
